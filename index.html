<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Compound Interest Calculator</title>
        <!-- Bootstrap CSS (using CDN) -->
        <link
            rel="stylesheet"
            href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
        />
        <!-- Custom Dark Mode CSS -->
        <style>
            body {
                background-color: #343a40;
                color: #ffffff;
            }
            .form-control,
            .custom-select {
                background-color: #495057;
                color: #ffffff;
                border: none;
            }
            .form-control:focus,
            .custom-select:focus {
                box-shadow: none;
            }
            .btn-primary {
                background-color: #007bff;
                border: none;
            }
            .card {
                background-color: #495057;
                border: none;
            }
            label {
                font-weight: bold;
            }
            .table-dark tbody tr td,
            .table-dark thead th {
                border-color: #6c757d;
            }
        </style>
        <!-- Chart.js -->
        <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    </head>
    <body>
        <div class="container my-4">
            <h1 class="text-center mb-4">Compound Interest Calculator</h1>
            <div class="row">
                <!-- Input Panel -->
                <div class="col-md-4">
                    <div class="card p-3 mb-4">
                        <h4>Input Parameters</h4>
                        <form id="calcForm">
                            <!-- Principal & Rates -->
                            <div class="form-group">
                                <label for="principal">Principal Amount</label>
                                <input
                                    type="number"
                                    class="form-control"
                                    id="principal"
                                    placeholder="Enter principal"
                                    required
                                />
                            </div>
                            <div class="form-group">
                                <label for="interestRate"
                                    >Annual Interest Rate (%)</label
                                >
                                <input
                                    type="number"
                                    step="0.01"
                                    class="form-control"
                                    id="interestRate"
                                    placeholder="Enter interest rate"
                                    required
                                />
                            </div>
                            <div class="form-group">
                                <label for="inflationRate"
                                    >Inflation Rate (%)</label
                                >
                                <input
                                    type="number"
                                    step="0.01"
                                    class="form-control"
                                    id="inflationRate"
                                    placeholder="Enter inflation rate"
                                    required
                                />
                            </div>
                            <div class="form-group">
                                <label for="compoundingFrequency"
                                    >Compounding Frequency</label
                                >
                                <select
                                    class="custom-select"
                                    id="compoundingFrequency"
                                >
                                    <option value="1">Yearly</option>
                                    <option value="12" selected>Monthly</option>
                                    <option value="365">Daily</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="duration">Duration (years)</label>
                                <input
                                    type="number"
                                    class="form-control"
                                    id="duration"
                                    placeholder="Enter duration in years"
                                    required
                                />
                            </div>
                            <hr />
                            <!-- Additional Contributions Section -->
                            <h5>Additional Contributions</h5>
                            <div id="contributionsList"></div>
                            <button
                                type="button"
                                id="addContribution"
                                class="btn btn-secondary btn-sm mb-2"
                            >
                                Add Contribution
                            </button>
                            <hr />
                            <button
                                type="submit"
                                class="btn btn-primary btn-block"
                            >
                                Calculate
                            </button>
                        </form>
                    </div>
                </div>
                <!-- Output Panel -->
                <div class="col-md-8">
                    <!-- Summary -->
                    <div class="card p-3 mb-4">
                        <h4>Summary</h4>
                        <div id="results">
                            <p>
                                <strong>Final Value:</strong>
                                <span id="finalValue"></span>
                            </p>
                            <p>
                                <strong>Total Contributions:</strong>
                                <span id="totalContributions"></span>
                            </p>
                            <p>
                                <strong>Total Interest Earned:</strong>
                                <span id="totalInterest"></span>
                            </p>
                            <p>
                                <strong>Inflation Adjusted Value:</strong>
                                <span id="realValue"></span>
                            </p>
                        </div>
                    </div>
                    <!-- Multi-line Growth Chart -->
                    <div class="card p-3 mb-4">
                        <h4>Growth Chart</h4>
                        <canvas id="growthChart"></canvas>
                    </div>
                    <!-- Stacked Breakdown Chart -->
                    <div class="card p-3 mb-4">
                        <h4>Breakdown Chart</h4>
                        <canvas id="breakdownChart"></canvas>
                    </div>
                    <!-- Yearly Breakdown Table with CSV Export -->
                    <div class="card p-3 mb-4">
                        <div
                            class="d-flex justify-content-between align-items-center"
                        >
                            <h4 class="mb-0">Yearly Breakdown</h4>
                            <button class="btn btn-info btn-sm" id="exportCSV">
                                Export CSV
                            </button>
                        </div>
                        <div class="table-responsive mt-2">
                            <table
                                class="table table-dark table-striped"
                                id="breakdownTable"
                            >
                                <thead>
                                    <tr>
                                        <th>Year</th>
                                        <th>Starting Value</th>
                                        <th>Contributions</th>
                                        <th>Interest Earned</th>
                                        <th>Ending Value</th>
                                        <th>Real Value</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <!-- Rows will be dynamically inserted here -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bootstrap & jQuery (via CDN) -->
        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

        <script>
            // Array to store additional contribution objects
            let contributions = [];

            // Add a new contribution input set
            function addContributionInput() {
                const id = Date.now(); // Unique identifier
                contributions.push({
                    id,
                    amount: 0,
                    type: "one-time",
                    startYear: 0,
                    frequency: 0,
                    growthType: "none",
                    growthValue: 0,
                });
                renderContributions();
            }

            // Render the contribution input fields dynamically
            function renderContributions() {
                const container = document.getElementById("contributionsList");
                container.innerHTML = "";
                contributions.forEach((contrib) => {
                    container.innerHTML += `
          <div class="border p-2 mb-2" data-id="${contrib.id}">
            <div class="form-group">
              <label>Contribution Amount</label>
              <input type="number" class="form-control contrib-amount" value="${
                  contrib.amount
              }" placeholder="Amount">
            </div>
            <div class="form-group">
              <label>Type</label>
              <select class="custom-select contrib-type">
                <option value="one-time" ${
                    contrib.type === "one-time" ? "selected" : ""
                }>One-Time</option>
                <option value="periodic" ${
                    contrib.type === "periodic" ? "selected" : ""
                }>Periodic</option>
              </select>
            </div>
            <div class="form-group">
              <label>Start Year</label>
              <input type="number" class="form-control contrib-startYear" value="${
                  contrib.startYear
              }" placeholder="Year">
            </div>
            <div class="form-group contrib-frequency-group" style="display: ${
                contrib.type === "periodic" ? "block" : "none"
            };">
              <label>Frequency (per year)</label>
              <input type="number" class="form-control contrib-frequency" value="${
                  contrib.frequency
              }" placeholder="Frequency">
            </div>
            <div class="form-group">
              <label>Growth</label>
              <select class="custom-select contrib-growthType">
                <option value="none" ${
                    contrib.growthType === "none" ? "selected" : ""
                }>None</option>
                <option value="percentage" ${
                    contrib.growthType === "percentage" ? "selected" : ""
                }>Percentage</option>
                <option value="fixed" ${
                    contrib.growthType === "fixed" ? "selected" : ""
                }>Fixed Amount</option>
              </select>
            </div>
            <div class="form-group contrib-growthValue-group" style="display: ${
                contrib.growthType !== "none" ? "block" : "none"
            };">
              <label>Growth Value (${
                  contrib.growthType === "percentage" ? "%" : "$"
              })</label>
              <input type="number" class="form-control contrib-growthValue" value="${
                  contrib.growthValue
              }" placeholder="Growth Value">
            </div>
            <button type="button" class="btn btn-danger btn-sm remove-contribution">Remove</button>
          </div>
        `;
                });

                // Remove contribution event
                document
                    .querySelectorAll(".remove-contribution")
                    .forEach((button) => {
                        button.addEventListener("click", function () {
                            const id = Number(
                                this.parentElement.getAttribute("data-id")
                            );
                            contributions = contributions.filter(
                                (c) => c.id !== id
                            );
                            renderContributions();
                        });
                    });

                // Toggle frequency input based on contribution type
                document.querySelectorAll(".contrib-type").forEach((select) => {
                    select.addEventListener("change", function () {
                        const parent = this.closest("[data-id]");
                        const type = this.value;
                        parent.querySelector(
                            ".contrib-frequency-group"
                        ).style.display =
                            type === "periodic" ? "block" : "none";
                    });
                });

                // Toggle growth value input based on growth type
                document
                    .querySelectorAll(".contrib-growthType")
                    .forEach((select) => {
                        select.addEventListener("change", function () {
                            const parent = this.closest("[data-id]");
                            const type = this.value;
                            parent.querySelector(
                                ".contrib-growthValue-group"
                            ).style.display =
                                type !== "none" ? "block" : "none";
                        });
                    });
            }

            document
                .getElementById("addContribution")
                .addEventListener("click", addContributionInput);

            // Render the detailed yearly breakdown table
            function renderBreakdownTable(data) {
                const tbody = document
                    .getElementById("breakdownTable")
                    .querySelector("tbody");
                tbody.innerHTML = "";
                data.forEach((item) => {
                    const tr = document.createElement("tr");
                    tr.innerHTML = `
          <td>${item.year}</td>
          <td>$${item.startingValue.toFixed(2)}</td>
          <td>$${item.contributions.toFixed(2)}</td>
          <td>$${item.interestEarned.toFixed(2)}</td>
          <td>$${item.endingValue.toFixed(2)}</td>
          <td>$${item.realValue.toFixed(2)}</td>
        `;
                    tbody.appendChild(tr);
                });
            }

            // Multi-line chart (Growth Chart) and Stacked Bar (Breakdown Chart) instances
            let growthChartInstance, breakdownChartInstance;

            // Update the multi-line growth chart
            function updateGrowthChart(
                labels,
                portfolioValues,
                cumContributions,
                cumInterest
            ) {
                const ctx = document
                    .getElementById("growthChart")
                    .getContext("2d");
                if (growthChartInstance) growthChartInstance.destroy();
                growthChartInstance = new Chart(ctx, {
                    type: "line",
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: "Portfolio Value",
                                data: portfolioValues,
                                borderColor: "rgba(0, 123, 255, 1)",
                                fill: false,
                                tension: 0.1,
                            },
                            {
                                label: "Cumulative Contributions",
                                data: cumContributions,
                                borderColor: "rgba(40, 167, 69, 1)",
                                fill: false,
                                tension: 0.1,
                            },
                            {
                                label: "Cumulative Interest",
                                data: cumInterest,
                                borderColor: "rgba(220, 53, 69, 1)",
                                fill: false,
                                tension: 0.1,
                            },
                        ],
                    },
                    options: {
                        scales: {
                            x: { title: { display: true, text: "Years" } },
                            y: {
                                title: { display: true, text: "Value ($)" },
                                beginAtZero: true,
                            },
                        },
                    },
                });
            }

            // Update the stacked bar breakdown chart
            function updateBreakdownChart(
                labels,
                annualContributions,
                annualInterest
            ) {
                const ctx = document
                    .getElementById("breakdownChart")
                    .getContext("2d");
                if (breakdownChartInstance) breakdownChartInstance.destroy();
                breakdownChartInstance = new Chart(ctx, {
                    type: "bar",
                    data: {
                        labels: labels,
                        datasets: [
                            {
                                label: "Contributions",
                                data: annualContributions,
                                backgroundColor: "rgba(40, 167, 69, 0.7)",
                            },
                            {
                                label: "Interest Earned",
                                data: annualInterest,
                                backgroundColor: "rgba(220, 53, 69, 0.7)",
                            },
                        ],
                    },
                    options: {
                        plugins: {
                            tooltip: { mode: "index", intersect: false },
                            legend: { display: true },
                        },
                        responsive: true,
                        scales: {
                            x: {
                                stacked: true,
                                title: { display: true, text: "Years" },
                            },
                            y: {
                                stacked: true,
                                title: { display: true, text: "Value ($)" },
                                beginAtZero: true,
                            },
                        },
                    },
                });
            }

            // Export table data as CSV
            function exportTableToCSV(filename) {
                let csv = [];
                const rows = document.querySelectorAll("#breakdownTable tr");
                rows.forEach((row) => {
                    let rowData = [];
                    row.querySelectorAll("td, th").forEach((cell) => {
                        rowData.push('"' + cell.innerText + '"');
                    });
                    csv.push(rowData.join(","));
                });
                const csvFile = new Blob([csv.join("\n")], {
                    type: "text/csv",
                });
                const downloadLink = document.createElement("a");
                downloadLink.download = filename;
                downloadLink.href = window.URL.createObjectURL(csvFile);
                downloadLink.style.display = "none";
                document.body.appendChild(downloadLink);
                downloadLink.click();
            }

            document
                .getElementById("exportCSV")
                .addEventListener("click", function () {
                    exportTableToCSV("breakdown.csv");
                });

            // Compound Interest Calculation Function with Yearly Breakdown
            function calculateCompoundInterest() {
                // Retrieve main inputs
                const principal = parseFloat(
                    document.getElementById("principal").value
                );
                const annualInterestRate =
                    parseFloat(document.getElementById("interestRate").value) /
                    100;
                const inflationRate =
                    parseFloat(document.getElementById("inflationRate").value) /
                    100;
                const compoundingFrequency = parseInt(
                    document.getElementById("compoundingFrequency").value
                );
                const duration = parseInt(
                    document.getElementById("duration").value
                );

                // Parse contribution inputs
                const contribElements = document.querySelectorAll(
                    "#contributionsList > div"
                );
                contributions = [];
                contribElements.forEach((div) => {
                    const id = Number(div.getAttribute("data-id"));
                    const amount =
                        parseFloat(
                            div.querySelector(".contrib-amount").value
                        ) || 0;
                    const type = div.querySelector(".contrib-type").value;
                    const startYear =
                        parseInt(
                            div.querySelector(".contrib-startYear").value
                        ) || 0;
                    const frequency =
                        type === "periodic"
                            ? parseInt(
                                  div.querySelector(".contrib-frequency").value
                              ) || 0
                            : 0;
                    const growthType = div.querySelector(
                        ".contrib-growthType"
                    ).value;
                    const growthValue =
                        parseFloat(
                            div.querySelector(".contrib-growthValue").value
                        ) || 0;
                    contributions.push({
                        id,
                        amount,
                        type,
                        startYear,
                        frequency,
                        growthType,
                        growthValue,
                    });
                });

                let totalContributions = 0;
                let currentValue = principal;
                let cumulativeContributions = 0;
                let cumulativeInterest = 0;

                let yearlyData = [];
                let yearsArr = [];
                let portfolioValuesArr = [];
                let cumContributionsArr = [];
                let cumInterestArr = [];
                let annualContributionsArr = [];
                let annualInterestArr = [];

                // Loop through each year and calculate details
                for (let year = 0; year <= duration; year++) {
                    let startingValue = currentValue;
                    let contributionsThisYear = 0;

                    // Process contributions for the current year
                    contributions.forEach((contrib) => {
                        if (year >= contrib.startYear) {
                            // One-Time Contribution: add only in the starting year
                            if (
                                contrib.type === "one-time" &&
                                year === contrib.startYear
                            ) {
                                currentValue += contrib.amount;
                                contributionsThisYear += contrib.amount;
                                totalContributions += contrib.amount;
                            }
                            // Periodic contributions: add each year from startYear onward
                            else if (contrib.type === "periodic") {
                                let yearsSinceStart = year - contrib.startYear;
                                for (let i = 0; i < contrib.frequency; i++) {
                                    let contributionAmount = contrib.amount;
                                    if (contrib.growthType === "percentage") {
                                        contributionAmount *= Math.pow(
                                            1 + contrib.growthValue / 100,
                                            yearsSinceStart
                                        );
                                    } else if (contrib.growthType === "fixed") {
                                        contributionAmount +=
                                            contrib.growthValue *
                                            yearsSinceStart;
                                    }
                                    currentValue += contributionAmount;
                                    contributionsThisYear += contributionAmount;
                                    totalContributions += contributionAmount;
                                }
                            }
                        }
                    });

                    // Record value before applying interest
                    let valueBeforeInterest = currentValue;
                    // Apply compound interest for the year (if not the final year)
                    if (year < duration) {
                        currentValue =
                            currentValue *
                            Math.pow(
                                1 + annualInterestRate / compoundingFrequency,
                                compoundingFrequency
                            );
                    }
                    // Calculate interest earned during this year
                    let interestEarned = currentValue - valueBeforeInterest;
                    cumulativeContributions += contributionsThisYear;
                    cumulativeInterest += interestEarned;

                    // Calculate inflation-adjusted (real) value for this year
                    let realValueYear =
                        currentValue / Math.pow(1 + inflationRate, year);

                    // Store yearly breakdown data
                    yearlyData.push({
                        year: year,
                        startingValue: startingValue,
                        contributions: contributionsThisYear,
                        interestEarned: interestEarned,
                        endingValue: currentValue,
                        realValue: realValueYear,
                    });

                    // Save data for charts
                    yearsArr.push(year);
                    portfolioValuesArr.push(currentValue);
                    cumContributionsArr.push(cumulativeContributions);
                    cumInterestArr.push(cumulativeInterest);
                    annualContributionsArr.push(contributionsThisYear);
                    annualInterestArr.push(interestEarned);
                }

                // Calculate summary values
                const totalInterest =
                    currentValue - principal - totalContributions;
                document.getElementById("finalValue").innerText =
                    "$" + currentValue.toFixed(2);
                document.getElementById("totalContributions").innerText =
                    "$" + totalContributions.toFixed(2);
                document.getElementById("totalInterest").innerText =
                    "$" + totalInterest.toFixed(2);
                document.getElementById("realValue").innerText =
                    "$" +
                    (
                        currentValue / Math.pow(1 + inflationRate, duration)
                    ).toFixed(2);

                // Update charts
                updateGrowthChart(
                    yearsArr,
                    portfolioValuesArr,
                    cumContributionsArr,
                    cumInterestArr
                );
                updateBreakdownChart(
                    yearsArr,
                    annualContributionsArr,
                    annualInterestArr
                );

                // Render the breakdown table
                renderBreakdownTable(yearlyData);
            }

            // Event listener for form submission
            document
                .getElementById("calcForm")
                .addEventListener("submit", function (e) {
                    e.preventDefault();
                    calculateCompoundInterest();
                });
        </script>
    </body>
</html>
